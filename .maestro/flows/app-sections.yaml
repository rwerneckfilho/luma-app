- assertVisible: "Losartana"
- takeScreenshot: "artifacts/medications"
- runFlow:
    file: ../helpers/launch-scenario.yaml
    env: { SCENARIO: history, ROUTE: "/(app)/history" }
- assertVisible: "Histórico"
- takeScreenshot: "artifacts/history"
- runFlow:
    file: ../helpers/launch-scenario.yaml
    env: { SCENARIO: care, ROUTE: "/(app)/caregivers" }
- assertVisible: "Paulo Oliveira"
- takeScreenshot: "artifacts/care"
- runFlow:
    file: ../helpers/launch-scenario.yaml
    env: { SCENARIO: profile, ROUTE: "/(app)/profile" }
- assertVisible: "Marina Oliveira"
- takeScreenshot: "artifacts/profile"

